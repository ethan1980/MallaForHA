<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malla</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<aside class="sidebar">

    <h1>🌐 Malla</h1>

    <nav>

        <button class="active">💬 Chat</button>

        <button>📡 Nodos</button>

        <button>📊 Estadísticas</button>

        <button>❤️ Salud</button>

        <button>⚙ Configuración</button>

    </nav>

</aside>

<main>

    <header>

        <h2>Global MeshView Chat</h2>

        <span class="online">🟢 Online</span>

    </header>

    <div id="newMessagesBanner" class="banner hidden">
        📡 Nuevos mensajes recibidos
    </div>

    <section id="messages">
        <!-- Mensajes dinámicos -->
    </section>

    <footer class="composer">

        <input
            id="messageInput"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
        />

        <select id="channelSelect">
            <option value="SFNarrow" selected>🟢 SFNarrow</option>
            <option value="LongFast">🔵 LongFast</option>
            <option value="MediumSlow">🟠 MediumSlow</option>
            <option value="Nexus">🟣 Nexus</option>
            <option value="Iberia">🇪🇸 Iberia</option>
            <option value="Madrid">🏙️ Madrid</option>
        </select>

        <button id="sendButton">
            Enviar
        </button>

    </footer>

</main>

<script src="app.js"></script>
</body>
</html>
