<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malla</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<aside class="sidebar">

    <h1>🌐 Malla</h1>

    <nav>

        <button id="tabChat" class="active">💬 Chat</button>
        <button id="tabNodes">📡 Nodos</button>

        <button>📊 Estadísticas</button>

        <button>❤️ Salud</button>

        <button>⚙ Configuración</button>

    </nav>

</aside>

<main>

   <section id="chatView" class="view active">
    
    <header>

        <h2>Global MeshView Chat</h2>

        <span class="online">🟢 Online</span>

    </header>

    <div id="newMessagesBanner" class="banner hidden">
        📡 Nuevos mensajes recibidos
    </div>

    <section id="messages">
        <!-- Mensajes dinámicos -->
    </section>

    <footer class="composer">

        <input
            id="messageInput"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
        />

        <select id="channelSelect">
            <option value="SFNarrow" selected>🟢 SFNarrow</option>
            <option value="LongFast">🔵 LongFast</option>
            <option value="MediumSlow">🟠 MediumSlow</option>
            <option value="Nexus">🟣 Nexus</option>
            <option value="Iberia">🇪🇸 Iberia</option>
            <option value="Madrid">🏙️ Madrid</option>
        </select>

        <button id="sendButton">
            Enviar
        </button>

    </footer>
   </section>
   <section id="nodesView" class="view hidden">

    <header>
        <h2>📡 Nodos MeshView</h2>
        <span id="nodesCount" class="online">0 nodos</span>
    </header>

    <div class="nodes-toolbar">
      <input id="nodeSearch" type="text" placeholder="Buscar nodo por nombre o ID...">

      <select id="nodeChannelFilter">
        <option value="all">🌍 Todos los canales</option>
        <option value="SFNarrow">🟢 SFNarrow</option>
        <option value="LongFast">🔵 LongFast</option>
        <option value="MediumSlow">🟠 MediumSlow</option>
        <option value="Nexus">🟣 Nexus</option>
        <option value="Iberia">🇪🇸 Iberia</option>
        <option value="Madrid">🏙️ Madrid</option>
      </select>

      <select id="nodeSort">
        <option value="recent" selected>🕒 Más recientes</option>
        <option value="oldest">📜 Más antiguos</option>
        <option value="name">🔤 Nombre A-Z</option>
      </select>
      
    </div>
    
    <div id="nodesList" class="nodes-list">
        <p>Cargando nodos...</p>
    </div>

   </section>

</main>

<script src="app.js"></script>
</body>
</html>
